name: Predict (pre-match)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      within:
        description: '只预测未来 N 小时内开赛的比赛'
        default: '24'
concurrency:
  group: predict
  cancel-in-progress: false
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Predict
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/predict/index.mjs --within=${{ github.event.inputs.within || '24' }}
